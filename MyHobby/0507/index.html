<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>나의취미 — 프리다이빙 · 우표 · 동전</title>
<meta name="description" content="개인 취미 아카이브. 프리다이빙, 우표, 동전 컬렉션." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Pretendard Variable"', 'Pretendard', 'Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  html, body {
    background: #000;
    color: #fff;
    font-family: 'Pretendard Variable', 'Pretendard', 'Inter', system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: rgba(255,255,255,0.2); color: #fff; }
  /* 스크롤바 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

function App() {
  const { data, error } = useData();
  const [route, setRoute] = useState({ page: 'home' });
  const [search, setSearch] = useState('');
  const [lightbox, setLightbox] = useState(null); // { items, index }
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // URL 해시 라우팅
  useEffect(() => {
    const apply = () => {
      const hash = window.location.hash.replace('#', '') || 'home';
      setRoute({ page: hash });
    };
    apply();
    window.addEventListener('hashchange', apply);
    return () => window.removeEventListener('hashchange', apply);
  }, []);

  const navigate = useCallback((page) => {
    window.location.hash = page === 'home' ? '' : page;
    setRoute({ page });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, []);

  const openLightbox = useCallback((items, index) => {
    setLightbox({ items, index });
  }, []);

  const navLightbox = useCallback((dir) => {
    setLightbox(lb => {
      if (!lb) return lb;
      const next = (lb.index + dir + lb.items.length) % lb.items.length;
      return { ...lb, index: next };
    });
  }, []);

  // 폰트 스케일 적용
  useEffect(() => {
    document.documentElement.style.fontSize = `${16 * tweaks.fontScale}px`;
  }, [tweaks.fontScale]);

  if (error) {
    return (
      <div className="min-h-screen flex items-center justify-center text-white/50 text-sm">
        데이터를 불러올 수 없습니다. data/index.json 을 확인하세요.
      </div>
    );
  }
  if (!data) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-white/30 text-[11px] font-mono uppercase tracking-widest animate-pulse">loading archive...</div>
      </div>
    );
  }

  let pageContent;
  switch (route.page) {
    case 'freediving':
      pageContent = <FreedivingPage data={data} onItemClick={openLightbox} search={search} tweaks={tweaks} />;
      break;
    case 'stamps':
      pageContent = <StampsPage data={data} onItemClick={openLightbox} search={search} tweaks={tweaks} />;
      break;
    case 'coins':
      pageContent = <CoinsPage data={data} onItemClick={openLightbox} search={search} tweaks={tweaks} />;
      break;
    default:
      pageContent = <HomePage data={data} onItemClick={openLightbox} search={search} />;
  }

  return (
    <div className="min-h-screen bg-black text-white">
      <Header route={route} navigate={navigate} search={search} setSearch={setSearch} />
      <main>{pageContent}</main>

      <footer className="border-t border-white/[0.06] mt-20">
        <div className="max-w-7xl mx-auto px-5 sm:px-8 py-10 text-[11px] font-mono uppercase tracking-widest text-white/30 flex flex-wrap justify-between gap-4">
          <div>© 2026 · semotube</div>
          <div>archive · {Object.values(data.hobbies).reduce((s, h) => s + h.items.length, 0)} items</div>
          <a href="https://github.com/semotube" target="_blank" className="hover:text-white/70">github / semotube</a>
        </div>
      </footer>

      {lightbox && (
        <Lightbox
          items={lightbox.items}
          index={lightbox.index}
          onClose={() => setLightbox(null)}
          onNav={navLightbox}
        />
      )}

      <TweaksPanel title="Tweaks">
        <TweakSection title="레이아웃">
          <TweakRadio
            label="배치"
            value={tweaks.layout}
            options={[
              { value: 'grid', label: '그리드' },
              { value: 'masonry', label: '메이슨리' },
              { value: 'list', label: '리스트' },
            ]}
            onChange={v => setTweak('layout', v)}
          />
          <TweakRadio
            label="밀도"
            value={tweaks.density}
            options={[
              { value: 'spacious', label: '여유' },
              { value: 'comfortable', label: '보통' },
              { value: 'dense', label: '조밀' },
            ]}
            onChange={v => setTweak('density', v)}
          />
        </TweakSection>
        <TweakSection title="표시">
          <TweakToggle
            label="다이빙 지도"
            checked={tweaks.showMap}
            onChange={v => setTweak('showMap', v)}
          />
          <TweakSlider
            label="폰트 크기"
            min={0.85} max={1.15} step={0.05}
            value={tweaks.fontScale}
            onChange={v => setTweak('fontScale', v)}
            format={v => `${Math.round(v * 100)}%`}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
