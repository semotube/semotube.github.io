<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>나의 앨범 · A Life in Photographs</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ["'Pretendard Variable'", "Pretendard", "system-ui", "sans-serif"],
          serif: ["'Instrument Serif'", "serif"],
        },
      },
    },
  };
</script>

<style>
  :root {
    /* 따뜻한 노을 톤 다크 베이스 — 자줏빛이 살짝 도는 깊은 마룬 */
    --bg-0: oklch(0.14 0.025 25);
    --bg-1: oklch(0.18 0.035 30);
    --accent-1: oklch(0.74 0.18 40);
    --accent-2: oklch(0.72 0.17 15);
    --accent-3: oklch(0.74 0.16 340);
    color-scheme: dark;
  }
  html, body { background: var(--bg-0); }
  body {
    font-family: 'Pretendard Variable', Pretendard, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(at 18% -8%, oklch(0.30 0.10 35) 0%, transparent 55%),
      radial-gradient(at 110% 20%, oklch(0.26 0.10 350) 0%, transparent 50%),
      radial-gradient(at 50% 110%, oklch(0.22 0.08 20) 0%, transparent 55%),
      var(--bg-0);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  .custom-scroll::-webkit-scrollbar-track { background: transparent; }
  .line-clamp-1 {
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  @supports(padding: max(0px)) {
    body { padding-bottom: env(safe-area-inset-bottom); }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js?v=2"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx?v=2"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "blur": 18,
    "alpha": 0.08,
    "accent": "sunset"
  }/*EDITMODE-END*/;

  function Root() {
    const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <>
        <App tweaks={tweaks} setTweak={setTweak} />
        <TweaksPanel title="Tweaks">
          <TweakSection label="유리 효과 · Glassmorphism" />
          <TweakSlider
            label="블러 강도"
            min={4} max={40} step={1}
            value={tweaks.blur}
            unit="px"
            onChange={(v) => setTweak('blur', v)}
          />
          <TweakSlider
            label="투명도 ×100"
            min={2} max={22} step={1}
            value={Math.round(tweaks.alpha * 100)}
            onChange={(v) => setTweak('alpha', v / 100)}
          />
          <TweakSection label="노을 톤" />
          <TweakRadio
            label="액센트"
            value={tweaks.accent}
            onChange={(v) => setTweak('accent', v)}
            options={[
              { value: 'sunset', label: '노을' },
              { value: 'peach',  label: '복숭아' },
              { value: 'coral',  label: '산호' },
              { value: 'golden', label: '황금' },
            ]}
          />
        </TweaksPanel>
      </>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<Root />);
</script>

</body>
</html>
